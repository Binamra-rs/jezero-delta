[project]
name = "jezero-delta"
version = "1.0.0"
description = "Jezero Delta Explorer backend: raster tiles, point inspection, terrain-aware A*, waypoints"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["jezero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
